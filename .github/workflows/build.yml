name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build WallpaperFlow.sln -c Release
      - name: Test
        run: dotnet test tests/WallpaperFlow.Core.Tests -c Release -p:Platform=x64
